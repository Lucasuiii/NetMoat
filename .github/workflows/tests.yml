name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - run: cargo +stable build --release --locked
      - run: ./target/release/netmoat validate --config examples/policy.json
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python netmoat.py render --config examples/policy.json
      - name: Build native controller
        if: matrix.os == 'macos-latest' && matrix.python == '3.13'
        run: |
          python scripts/test_controller.py
          python scripts/build_controller.py --output "$RUNNER_TEMP/NetMoat.app"
