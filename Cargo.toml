[package]
name = "netmoat"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "A macOS PF egress policy service with retained rules and transactional configuration"

[dependencies]
anyhow = "1"
fs2 = "0.4"
ipnet = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.4"
tempfile = "3"

[dev-dependencies]
wait-timeout = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
