[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netmoat-macos"
version = "0.4.0"
description = "Optional temporary-session and decoy verification tools for NetMoat"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Lucasuiii"}]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: MacOS", "Programming Language :: Python :: 3"]

[project.scripts]
netmoat-tools = "netmoat:main"

[tool.setuptools]
py-modules = ["netmoat"]
