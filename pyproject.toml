[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gfw-macos"
version = "0.1.0"
description = "A small, session-scoped macOS PF egress policy and verification framework"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Lucasuiii"}]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: MacOS", "Programming Language :: Python :: 3"]

[project.scripts]
gfw = "gfw:main"

[tool.setuptools]
py-modules = ["gfw"]
